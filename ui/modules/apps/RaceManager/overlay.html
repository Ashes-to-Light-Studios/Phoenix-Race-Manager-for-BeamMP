<!doctype html>
<!--
  Phoenix Race Manager: the optional BROADCAST OVERLAY.

  Served by the game itself (lua/ge/extensions/raceManager/feed.lua) at
  http://127.0.0.1:8128/overlay, for an OBS Browser Source or any browser.
  It reads the same feed your own graphics would: /stream (Server-Sent
  Events), falling back to polling /live.json.

  Views, by query string:
    ?view=tower    running order (default)     &rows=N  &gap=leader|interval
    ?view=grid     the starting grid
    ?view=banner   one line: flag, lap or clock, fastest lap; or what you choose
                   &show=session,lap,time|leader,margin|order  (`|` = a new page)
                   &cycle=8 (seconds a page)  &per=5 (drivers a page of the order)
    ?view=results  the classification
    ?view=ticker   what just happened (laps, the joker, pit stops, flags)
  And for any view: &class=GT3 (one class), &scale=1.5, &theme=light,
  &poll=1 (no stream), &src=http://192.168.1.20:8128 (another PC's feed),
  &demo=1 (a sample race, to style with no session running).

  THE LOOK comes from the feed's /style.json, edited on the style page
  (/style, opened from the Feed panel). It arrives at start, then live
  (`event: style` on the stream; a polling overlay watches `styleSeq`).
  applyStyle() is the one place it is used, and it checks every value again.
  The URL still wins where it says something: &theme=light, &scale.
  &preview=1 is for the style page: it takes a draft style from the page it
  sits in (postMessage, same origin, the parent window only).

  Everything is drawn with textContent: driver names are typed by players,
  and nothing a player types may run inside your streaming software.
  Images are plain <img> with no referrer, shown once they have loaded.

  For a custom stylesheet: the root has data-view; tower, grid and results
  rows have data-pos, data-class and data-team (the short code); the parts
  are .panel .brand .head .flag .title .meta .rows .row .pos .bar .carno .tlogo
  .name .gap .badges .badge .slot .banner .results .toast .sponsor.
  The banner's root has data-page, each of its cells data-item (lap, order...),
  and the turning part is .page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PRM overlay</title>
<style>
  :root {
    /* The defaults. applyStyle() sets every one from the style. */
    --bg: rgba(12, 14, 20, 0.86);
    --bg-alt: rgba(26, 29, 38, 0.86);
    --fg: #f2f4f8;
    --muted: #9aa3b2;
    --line: rgba(242, 244, 248, 0.08);
    --accent: #ff7a1a;
    --on-accent: #111111;
    --fastest: #b06cff;
    --on-fastest: #ffffff;
    --gain: #3ddc84;
    --loss: #ff5c5c;
    --pit: #3b82f6;
    --on-pit: #ffffff;
    --flash-up: rgba(61, 220, 132, 0.28);
    --flash-down: rgba(255, 92, 92, 0.22);
    --flag-green: #1db954;
    --flag-yellow: #ffd400;
    --on-yellow: #111111;
    --flag-red: #e53935;
    --on-red: #ffffff;
    --flag-white: #f5f5f5;
    --on-white: #111111;
    --scale: 1;
    --radius: 0.3em;
    --row-h: 1.85em;
    --name-w: 11em;
    --w: 700;
    --w-strong: 800;
    --case: none;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--fg);
    font-family: var(--font);
    font-size: calc(16px * var(--scale));
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* Until the style has been applied (or 1.5 s): the default look never flashes first. */
  html.loading .wrap { visibility: hidden; }
  .wrap { padding: 0.75em; display: inline-block; }
  .hidden { display: none !important; }

  /* Waiting for the game */
  .waiting {
    display: inline-flex; align-items: center; gap: 0.6em;
    background: var(--bg); padding: 0.5em 0.9em; border-radius: var(--radius);
    font-size: 0.85em; color: var(--muted);
  }
  .waiting::before {
    content: ""; width: 0.6em; height: 0.6em; border-radius: 50%;
    background: var(--accent); animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* One panel per view: the parts inside draw their own background. */
  .panel { display: inline-block; vertical-align: top; border-radius: var(--radius); overflow: hidden; min-width: 17em; }
  .panel.results { min-width: 26em; }

  /* Branding: the league's logo, a title and a line under it */
  .brand {
    display: flex; align-items: center; gap: 0.65em; background: var(--bg);
    padding: 0.45em 0.7em; border-bottom: 1px solid var(--line);
  }
  .brand img { height: 2.1em; width: auto; max-width: 9em; object-fit: contain; flex: none; }
  .brand .btitle { font-weight: var(--w-strong); font-size: 1.05em; white-space: nowrap; }
  .brand .bsub { color: var(--muted); font-size: 0.78em; font-weight: var(--w); white-space: nowrap; }
  .sponsor { background: var(--bg); padding: 0.4em 0.7em; display: flex; justify-content: center; border-top: 1px solid var(--line); }
  .sponsor img { height: 1.7em; width: auto; max-width: 14em; object-fit: contain; }

  /* Header strip shared by tower, grid and results */
  .head { display: flex; align-items: stretch; background: var(--bg); overflow: hidden; }
  .head .flag { width: 0.45em; flex: none; }
  .head .title { padding: 0.45em 0.7em; font-weight: var(--w-strong); letter-spacing: 0.04em; text-transform: uppercase; flex: 1; white-space: nowrap; }
  .head .meta { padding: 0.45em 0.7em; color: var(--muted); font-weight: var(--w); white-space: nowrap; }
  .flag.green { background: var(--flag-green); }
  .flag.yellow { background: var(--flag-yellow); }
  .flag.red { background: var(--flag-red); }
  .flag.white { background: var(--flag-white); }
  .flag.checkered {
    background: repeating-conic-gradient(#111 0 25%, #f5f5f5 0 50%) 0 0 / 0.5em 0.5em;
  }
  .flag.none { background: var(--muted); opacity: 0.4; }
  .flagtext { padding: 0.25em 0.7em; font-size: 0.75em; font-weight: var(--w-strong); letter-spacing: 0.08em; }
  .flagtext.yellow { background: var(--flag-yellow); color: var(--on-yellow); }
  .flagtext.red { background: var(--flag-red); color: var(--on-red); }
  .flagtext.white { background: var(--flag-white); color: var(--on-white); }
  .flagtext.checkered { background: #111; color: #fff; }
  .flagtext.green { background: var(--flag-green); color: #fff; }

  /* Tower */
  .rows { background: var(--bg); overflow: hidden; }
  .row {
    display: flex; align-items: center; height: var(--row-h); border-top: 1px solid var(--line);
    transition: background-color 0.6s;
  }
  .row:nth-child(even) { background: var(--bg-alt); }
  .row.moved-up { background: var(--flash-up); }
  .row.moved-down { background: var(--flash-down); }
  .row.out { opacity: 0.55; }
  .pos { width: 1.9em; text-align: center; font-weight: var(--w-strong); flex: none; }
  .row:first-child .pos { color: var(--accent); }
  .bar { width: 0.22em; height: 65%; background: var(--accent); flex: none; border-radius: 0.1em; opacity: 0.9; }
  .carno {
    flex: none; margin-left: 0.45em; font-weight: var(--w-strong); font-size: 0.78em;
    min-width: 1.75em; text-align: center; white-space: nowrap;
  }
  .carno.chip {
    padding: 0.05em 0.3em; border-radius: calc(var(--radius) * 0.6);
    background: var(--accent); color: var(--on-accent); line-height: 1.25;
  }
  .carno.plain { color: var(--muted); }
  .carno.plain::before { content: "#"; opacity: 0.6; }
  .tlogo { height: 1.15em; width: auto; max-width: 2.6em; object-fit: contain; flex: none; margin-left: 0.45em; }
  .name {
    flex: 1; padding: 0 0.55em; font-weight: var(--w); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; min-width: 6em; max-width: var(--name-w); text-transform: var(--case);
  }
  .gap { width: 5.2em; text-align: right; padding-right: 0.55em; color: var(--muted); font-weight: var(--w); font-size: 0.9em; white-space: nowrap; }
  .row:first-child .gap { color: var(--fg); }
  .badges { display: flex; gap: 0.25em; padding-right: 0.45em; flex: none; min-width: 1.6em; justify-content: flex-end; }
  .badge {
    font-size: 0.68em; font-weight: var(--w-strong); padding: 0.08em 0.35em; border-radius: calc(var(--radius) * 0.6);
    background: var(--line); color: var(--fg); white-space: nowrap;
  }
  .badge.joker { background: var(--accent); color: var(--on-accent); }
  .badge.pit { background: var(--pit); color: var(--on-pit); }
  /* Mandatory stops still owed: PIT 0/2 in outline, filled once all are made. */
  .badge.pit.owed { background: transparent; color: var(--pit); box-shadow: inset 0 0 0 1px var(--pit); }
  .badge.fast { background: var(--fastest); color: var(--on-fastest); }
  .badge.out { background: var(--flag-red); color: var(--on-red); }
  .badge.black { background: #000000; color: #ffffff; box-shadow: inset 0 0 0 1px #ffffff; }

  /* Grid */
  .gridbox { background: var(--bg); padding: 0.5em 0.6em 0.7em; }
  .gridrow { display: flex; gap: 0.6em; }
  .slot {
    flex: 1; display: flex; align-items: center; gap: 0.45em; background: var(--bg-alt);
    border-left: 0.2em solid var(--accent); border-radius: calc(var(--radius) * 0.6); padding: 0.35em 0.55em;
    margin-top: 0.45em; min-width: 9.5em;
  }
  .slot.nobar { border-left-width: 0; }
  .gridrow .slot:nth-child(2) { margin-top: 1.25em; }
  .slot .n { font-weight: var(--w-strong); color: var(--accent); width: 1.4em; }
  .slot .carno, .slot .tlogo { margin-left: 0; }
  .slot .who { font-weight: var(--w); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-transform: var(--case); }
  .slot .t { color: var(--muted); font-size: 0.8em; }

  /* Banner */
  .banner { display: inline-flex; align-items: stretch; background: var(--bg); border-radius: var(--radius); overflow: hidden; }
  .banner > div, .banner .page > div { padding: 0.45em 0.8em; display: flex; flex-direction: column; justify-content: center; white-space: nowrap; }
  .banner > .page { padding: 0; flex-direction: row; justify-content: flex-start; }
  .banner .page.turn { animation: bturn 0.35s ease-out both; }
  @keyframes bturn { from { opacity: 0; transform: translateY(0.4em); } }
  .banner .who, .banner .ent { display: inline-flex; align-items: center; gap: 0.35em; }
  .banner .who .carno, .banner .who .tlogo, .banner .ent .carno, .banner .ent .tlogo { margin-left: 0; }
  .banner .nm { text-transform: var(--case); }
  .banner .ents { display: flex; gap: 1em; }
  .banner .ent .p, .banner .who .p { color: var(--accent); }
  .banner .ent .g { color: var(--muted); font-weight: var(--w); font-size: 0.8em; }
  .banner .ent .badges { padding: 0; min-width: 0; }
  .banner .flag { padding: 0; width: 0.5em; }
  .banner .k { font-size: 0.62em; color: var(--muted); font-weight: var(--w); letter-spacing: 0.1em; text-transform: uppercase; }
  .banner .v { font-weight: var(--w-strong); font-size: 1.1em; }
  .banner .sep { border-left: 1px solid var(--line); }
  .banner .fast .v { color: var(--fastest); }
  .banner .pic { padding: 0.25em 0.7em; }
  .banner .pic img { height: 1.9em; width: auto; max-width: 10em; object-fit: contain; }

  /* Results */
  table.results { border-collapse: collapse; background: var(--bg); width: 100%; }
  table.results td { padding: 0.3em 0.6em; border-top: 1px solid var(--line); white-space: nowrap; }
  table.results tr:nth-child(even) td { background: var(--bg-alt); }
  table.results td.p { font-weight: var(--w-strong); text-align: center; width: 1.6em; }
  table.results td.id { padding-right: 0; }
  table.results td.id:empty { padding: 0; }
  table.results td.id .carno, table.results td.id .tlogo { margin-left: 0; margin-right: 0.3em; vertical-align: middle; display: inline-block; }
  table.results td.nm { font-weight: var(--w); text-transform: var(--case); }
  table.results td.num { text-align: right; color: var(--muted); }
  table.results td.best.fast { color: var(--fastest); font-weight: var(--w); }
  table.results td.gain { color: var(--gain); text-align: right; }
  table.results td.loss { color: var(--loss); text-align: right; }

  /* Ticker */
  .ticker { display: flex; flex-direction: column; gap: 0.35em; align-items: flex-start; }
  .toast {
    display: flex; align-items: center; gap: 0.5em;
    background: var(--bg); border-left: 0.25em solid var(--accent); border-radius: calc(var(--radius) * 0.6);
    padding: 0.4em 0.75em; font-weight: var(--w); animation: in 0.35s ease-out;
    transition: opacity 0.8s;
  }
  .toast .carno { margin-left: 0; }
  .toast.joker { border-left-color: var(--accent); }
  .toast.pit { border-left-color: var(--pit); }
  .toast.fastest { border-left-color: var(--fastest); }
  .toast.flag, .toast.caution { border-left-color: var(--flag-yellow); }
  .toast.out, .toast.penalty { border-left-color: var(--flag-red); }
  .toast.finish, .toast.leader { border-left-color: var(--flag-green); }
  .toast.fading { opacity: 0; }
  @keyframes in { from { transform: translateX(-1em); opacity: 0; } }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="waiting" id="waiting">Waiting for Phoenix Race Manager…</div>
  <div id="view"></div>
</div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var VIEW = (q.get('view') || 'tower').toLowerCase();
  var ROWS = Math.max(1, Math.min(60, parseInt(q.get('rows'), 10) || 20));
  var GAP = (q.get('gap') || 'leader').toLowerCase() === 'interval' ? 'interval' : 'leader';
  var CLASS = q.get('class') || '';
  var POLL_ONLY = q.get('poll') === '1';
  // Another PC's feed: an origin only (scheme, host, port), nothing else.
  var SRC = (q.get('src') || '').replace(/\/+$/, '');
  if (SRC && !/^https?:\/\/[a-z0-9.\-\[\]:]+$/i.test(SRC)) { SRC = ''; }
  // The banner: what it shows (else the style's `banner`), the seconds a page
  // (else the style's `bannerCycle`; 0 puts every page on one line), and the
  // drivers a page of the running order.
  var SHOW = q.get('show');
  var URL_CYCLE = parseFloat(q.get('cycle'));
  if (!(URL_CYCLE === 0 || (URL_CYCLE >= 1 && URL_CYCLE <= 600))) { URL_CYCLE = NaN; }
  var PER = Math.max(1, Math.min(20, parseInt(q.get('per'), 10) || 5));
  var TICKER_HOLD = Math.max(2, parseFloat(q.get('hold')) || 8) * 1000;
  var TICKER_MAX = Math.max(1, Math.min(10, parseInt(q.get('max'), 10) || 4));
  var URL_SCALE = parseFloat(q.get('scale'));
  if (!(URL_SCALE > 0 && URL_SCALE < 10)) { URL_SCALE = 0; }
  var LIGHT = (q.get('theme') || '').toLowerCase() === 'light';
  var DEMO = q.get('demo') === '1';
  var PREVIEW = q.get('preview') === '1';

  var rootEl = document.documentElement;
  rootEl.classList.add('loading');
  var waitingEl = document.getElementById('waiting');
  var viewEl = document.getElementById('view');
  document.getElementById('root').setAttribute('data-view', VIEW);

  // ------------------------------------------------------------- the style
  // The defaults, the same as feedstyle.lua D.SPEC (and the :root above).
  var DEFAULTS = {
    colors: {
      bg: '#0c0e14', bgAlt: '#1a1d26', fg: '#f2f4f8', muted: '#9aa3b2',
      accent: '#ff7a1a', fastest: '#b06cff', gain: '#3ddc84', loss: '#ff5c5c',
      pit: '#3b82f6', flagGreen: '#1db954', flagYellow: '#ffd400',
      flagRed: '#e53935', flagWhite: '#f5f5f5'
    },
    opacity: 0.86, scale: 1, radius: 0.3, rowHeight: 1.85, nameWidth: 11,
    font: 'system', weight: 'bold', uppercase: false,
    bar: 'team', nameFormat: 'full', numbers: 'chip', teamLogos: true,
    badges: true, gained: true, flash: true, flagStripe: true,
    logo: '', sponsor: '', title: '', subtitle: '',
    banner: 'logo,flag,session,lap,time,countdown,fastest,sponsor', bannerCycle: 8,
    labels: {
      leader: 'LEADER', lap: 'LAP', noTime: 'NO TIME', race: 'Race', qualifying: 'Qualifying',
      qualiResult: 'Qualifying result', result: 'Result', standings: 'Standings',
      startingGrid: 'Starting grid', provisionalGrid: 'Provisional grid', noGrid: 'No grid yet',
      session: 'Session', timeLeft: 'Time left', time: 'Time', start: 'Start',
      fastestLap: 'Fastest lap', track: 'Track', toGo: 'To go', margin: 'Margin',
      order: 'Running order', onBoard: 'On board', heat: 'Heat', field: 'Field', latest: 'Latest',
      jokers: 'Jokers taken', pits: 'Pit stops', pitsDone: 'All stops made',
      waiting: 'Waiting for Phoenix Race Manager…',
      pit: 'PIT', fl: 'FL', joker: 'J'
    },
    css: ''
  };
  // The banner's items (feedstyle.lua D.BANNER_ITEMS). logo, flag and sponsor
  // are its frame: on every page, wherever they are named.
  var BANNER_ITEMS = ['logo', 'flag', 'session', 'title', 'track', 'lap', 'togo', 'time', 'clock',
    'left', 'countdown', 'fastest', 'leader', 'margin', 'order', 'onboard', 'heat', 'field',
    'joker', 'pits', 'latest', 'sponsor'];
  var BANNER_FRAME = { logo: true, flag: true, sponsor: true };
  // "session,lap|order" -> [['session', 'lap'], ['order']], or null. strict: a
  // name it does not know makes the whole value null, as the feed refuses it
  // (a saved style); otherwise that name is dropped (a link's &show=).
  function bannerPages(v, strict) {
    if (typeof v !== 'string' || v.length > 200) { return null; }
    var pages = [], bad = false;
    v.toLowerCase().replace(/\s+/g, '').split('|').forEach(function (p) {
      var items = p.split(',').filter(function (it) {
        if (!it) { return false; }
        if (BANNER_ITEMS.indexOf(it) < 0) { bad = true; return false; }
        return true;
      });
      if (items.length) { pages.push(items); }
    });
    if ((strict && bad) || !pages.length || pages.length > 8) { return null; }
    return pages;
  }
  var FONTS = {
    system: '"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif',
    condensed: '"Bahnschrift SemiCondensed", Bahnschrift, "Roboto Condensed", "Arial Narrow", sans-serif',
    mono: '"JetBrains Mono", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace',
    serif: 'Georgia, Cambria, "Times New Roman", serif',
    rounded: 'Nunito, "Varela Round", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif'
  };
  var WEIGHTS = { regular: ['500', '700'], bold: ['700', '800'], black: ['800', '900'] };
  var KINDS = { png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image', svg: 'image',
    woff2: 'font', woff: 'font', ttf: 'font', otf: 'font', css: 'css' };
  var HEX = /^#[0-9a-fA-F]{6}$/;
  var WEB = /^https?:\/\/[^\s"'<>\\`()]+$/;

  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function own(o, k) { return typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k); }
  function color(v, d) { return typeof v === 'string' && HEX.test(v) ? v.toLowerCase() : d; }
  function num(v, lo, hi, d) {
    v = typeof v === 'number' ? v : NaN;
    return (isFinite(v) && v >= lo && v <= hi) ? v : d;
  }
  function bool(v, d) { return typeof v === 'boolean' ? v : d; }
  function oneOf(v, list, d) { return list.indexOf(v) >= 0 ? v : d; }
  function text(v, max, d) {
    if (typeof v !== 'string') { return d; }
    v = v.replace(/[\u0000-\u001f\u007f]/g, '').trim();
    return v.length <= max ? v : d;
  }
  // 'asset:<name>' of the given kind -> the name, else null.
  function assetName(v, kind) {
    if (typeof v !== 'string' || v.indexOf('asset:') !== 0) { return null; }
    var n = v.slice(6);
    if (n.length > 64 || n.indexOf('..') >= 0 || !/^[a-z0-9][a-z0-9._-]*$/.test(n)) { return null; }
    var m = /\.([a-z0-9]+)$/.exec(n);
    return (m && KINDS[m[1]] === kind && n !== 'style.json') ? n : null;
  }
  function assetUrl(n, rev) { return SRC + '/assets/' + encodeURIComponent(n) + '?v=' + rev; }
  // An image: one of the folder's, or a web link. Returns its URL, or ''.
  function image(v, rev) {
    var n = assetName(v, 'image');
    if (n) { return assetUrl(n, rev); }
    return (typeof v === 'string' && v.length <= 300 && WEB.test(v)) ? v : '';
  }

  // Any input -> a whole, checked style (the defaults where it says nothing usable).
  function clean(s) {
    s = isObj(s) ? s : {};
    var d = DEFAULTS, o = {}, k;
    var rev = num(s.assetsRev, 0, 1e12, 0);
    o.seq = num(s.seq, 0, 1e12, -1);
    o.assetsRev = rev;
    var c = isObj(s.colors) ? s.colors : {};
    o.colors = {};
    for (k in d.colors) { o.colors[k] = color(c[k], d.colors[k]); }
    o.opacity = num(s.opacity, 0, 1, d.opacity);
    o.scale = num(s.scale, 0.5, 3, d.scale);
    o.radius = num(s.radius, 0, 1, d.radius);
    o.rowHeight = num(s.rowHeight, 1.4, 2.8, d.rowHeight);
    o.nameWidth = num(s.nameWidth, 6, 20, d.nameWidth);
    o.font = own(FONTS, s.font) || assetName(s.font, 'font') ? s.font : d.font;
    o.weight = oneOf(s.weight, ['regular', 'bold', 'black'], d.weight);
    o.uppercase = bool(s.uppercase, d.uppercase);
    o.bar = oneOf(s.bar, ['team', 'class', 'accent', 'none'], d.bar);
    // Maps without a prototype: a class called "__proto__" is just a name.
    o.classColors = Object.create(null);
    var n = 0;

            var stops = 0;
            doc.drivers.forEach(function (d) { if (inClass(d)) { stops += d.pitStops || 0; } });
            if (stops > 0) { put(it, L.pits, String(stops)); }
          }
        }
      } else if (it === 'latest') {
        put(it, L.latest, lastNews(doc));
      }
    });
    return n;
  }

  // The running order, PER drivers at a time from bTurn.offset: a turning
  // banner steps through the field before it moves on to the next page.
  function orderCell(parent, doc, list) {
    if (!list.length) { return false; }
    if (bTurn.offset >= list.length) { bTurn.offset = 0; }
    var from = bTurn.offset, part = list.slice(from, from + PER), quali = doc.session.kind === 'quali';
    var c = el('div', 'sep order');
    c.setAttribute('data-item', 'order');
    var range = list.length > PER ? (from + 1) + '–' + (from + part.length) : '';
    c.appendChild(el('span', 'k', L.order && range ? L.order + ' ' + range : (L.order || range)));
    var row = el('span', 'v ents');
    part.forEach(function (d, i) {
      var at = from + i;
      var e = el('span', 'ent');
      var pos = CLASS && d.classPos ? d.classPos : (d.position || at + 1);
      tag(e, d, pos);
      e.appendChild(el('span', 'p', pos));
      identity(e, d);
      e.appendChild(el('span', 'nm', nameOf(d.name)));
      var gap;
      if (quali) { gap = at === 0 ? d.bestLapText : d.gapText; }
      else if (at === 0) { gap = d.status === 'finished' ? d.finishText : ''; }
      else { gap = (GAP === 'interval' ? d.intervalText : d.gapText) || d.gapText; }
      if (gap) { e.appendChild(el('span', 'g', gap)); }
      if (ST.badges) {
        var bs = badges(d, doc.session);
        if (bs.firstChild) { e.appendChild(bs); }
      }
      row.appendChild(e);
    });
    c.appendChild(row);
    parent.appendChild(c);
    bTurn.more = from + PER < list.length;
    return true;
  }

  function banner(doc) {
    var s = doc.session;
    var cfg = bannerConfig();
    var key = cfg.pages.map(function (p) { return p.join(','); }).join('|');
    if (key !== bTurn.key) { bTurn.key = key; bTurn.page = 0; bTurn.offset = 0; bTurn.at = Date.now(); }
    bTurn.pages = cfg.pages.length;
    bTurn.cycle = cfg.cycle;
    if (bTurn.page >= cfg.pages.length) { bTurn.page = 0; bTurn.offset = 0; }

    var b = el('div', 'banner');
    if (cfg.frame.logo) {
      var logo = picture(ST.logo, null);
      if (logo) { var lc = el('div', 'pic'); lc.appendChild(logo); b.appendChild(lc); }
    }
    if (cfg.frame.flag && ST.flagStripe) { b.appendChild(el('div', 'flag ' + (s.flag || 'none'))); }
    // A page with nothing to say now (no camera, no order yet) is passed over
    // for the next that has, rather than leaving an empty banner up.
    var pg = null;
    for (var tries = 0; tries < cfg.pages.length; tries += 1) {
      pg = el('div', 'page');
      if (bannerPage(pg, doc, cfg.pages[bTurn.page]) > 0 || cfg.pages.length === 1) { break; }
      bTurn.page = (bTurn.page + 1) % cfg.pages.length;
      bTurn.offset = 0;
      bTurn.at = Date.now();
    }
    // The page that just turned slides in; a redraw mid-way carries on from
    // where the slide had got to instead of starting it again.
    var since = Date.now() - bTurn.turnedAt;
    if (since < 350) { pg.classList.add('turn'); pg.style.animationDelay = (-since) + 'ms'; }
    b.setAttribute('data-page', String(bTurn.page + 1));
    b.appendChild(pg);
    if (cfg.frame.sponsor) {
      var sp = picture(ST.sponsor, null);
      if (sp) { var sc = el('div', 'pic sep'); sc.appendChild(sp); b.appendChild(sc); }
    }
    return b;
  }
  // Turning: the next PER of the running order while there are more, else the
  // next page. Nothing turns with one page and no order to step through.
  setInterval(function () {
    if (VIEW !== 'banner' || !lastDoc || !(bTurn.cycle > 0)) { return; }
    var now = Date.now();
    if (now - bTurn.at < bTurn.cycle * 1000) { return; }
    bTurn.at = now;
    if (bTurn.more) { bTurn.offset += PER; }
    else {
      var next = (bTurn.page + 1) % bTurn.pages;
      if (next === bTurn.page && bTurn.offset === 0) { return; }
      bTurn.page = next;
      bTurn.offset = 0;
    }
    bTurn.turnedAt = now;
    rerender();
  }, 250);

  function results(doc) {
    var s = doc.session;
    var p = panel('results');
    var over = s.phase === 'finished';
    var title = s.kind === 'quali' ? (over ? L.qualiResult : L.qualifying) : (over ? L.result : L.standings);
    p.appendChild(header(title, s.layout || '', s.flag));
    var t = el('table', 'results');
    doc.drivers.filter(inClass).slice(0, ROWS).forEach(function (d, i) {
      var tr = el('tr');
      var shownPos = d.out ? '–' : (CLASS && d.classPos ? d.classPos : d.position);
      tag(tr, d, d.out ? null : shownPos);
      tr.appendChild(el('td', 'p', shownPos));
      var idc = el('td', 'id');
      identity(idc, d);
      tr.appendChild(idc);
      tr.appendChild(el('td', 'nm', nameOf(d.name)));
      if (s.kind === 'quali') {
        tr.appendChild(el('td', 'num', d.bestLapText || L.noTime));
        tr.appendChild(el('td', 'num', i === 0 ? '' : d.gapText));
      } else {
        tr.appendChild(el('td', 'num', d.out ? d.statusText : (i === 0 ? d.finishText : (d.gapText || d.finishText))));
        tr.appendChild(el('td', 'num best' + (d.fastest ? ' fast' : ''), d.bestLapText));
        if (ST.gained) {
          var g = d.gained;
          tr.appendChild(el('td', g > 0 ? 'gain' : (g < 0 ? 'loss' : 'num'), d.gainedText));
        }
      }
      t.appendChild(tr);
    });
    p.appendChild(t);
    return finish(p);
  }

  // The ticker keeps its own list: an event shows for TICKER_HOLD, once.
  var seenSeq = null;      // events up to here were on screen before we looked
  var shown = [];          // { seq, node, until }
  var tickerBox = null;
  function ticker(doc) {
    if (!tickerBox) { tickerBox = el('div', 'ticker'); }
    var events = doc.events || [];
    if (seenSeq === null) {
      // The first look: what already happened is not news.
      seenSeq = events.length ? events[events.length - 1].seq : 0;
    }
    events.forEach(function (e) {
      if (e.seq <= seenSeq) { return; }
      seenSeq = e.seq;
      if (!e.text) { return; }
      var who = null;
      if (e.id !== null && e.id !== undefined) {
        doc.drivers.forEach(function (d) { if (d.id === e.id) { who = d; } });
      }
      if (CLASS && who && who.class !== CLASS) { return; }
      var node = el('div', 'toast ' + e.type);
      if (who) { tag(node, who, null); identity(node, who); }
      node.appendChild(el('span', 'tx', e.text));
      tickerBox.insertBefore(node, tickerBox.firstChild);
      shown.unshift({ seq: e.seq, node: node, until: Date.now() + TICKER_HOLD });
    });
    while (shown.length > TICKER_MAX) {
      var old = shown.pop();
      if (old.node.parentNode) { old.node.parentNode.removeChild(old.node); }
    }
    return tickerBox;
  }
  setInterval(function () {
    var now = Date.now();
    shown = shown.filter(function (s) {
      if (now < s.until) { return true; }
      s.node.classList.add('fading');
      setTimeout(function () { if (s.node.parentNode) { s.node.parentNode.removeChild(s.node); } }, 900);
      return false;
    });
  }, 250);

  var VIEWS = { tower: tower, grid: grid, banner: banner, results: results, ticker: ticker };
  var render = VIEWS[VIEW] || tower;

  // ------------------------------------------------------------ the data
  var lastSeq = -1, lastEpoch = null, lastDoc = null;
  function draw(doc) {
    lastDoc = doc;
    var live = doc.connected === true;
    waitingEl.classList.toggle('hidden', live);
    viewEl.classList.toggle('hidden', !live);
    if (!live) { return; }
    var out = render(doc);
    if (out !== tickerBox || viewEl.firstChild !== tickerBox) {
      clear(viewEl);
      viewEl.appendChild(out);
    }
  }
  function rerender() { if (lastDoc) { draw(lastDoc); } }
  function show(doc) {
    if (!doc || typeof doc !== 'object' || doc.feed !== 1) { return; }
    watchStyleSeq(doc.styleSeq);
    if (DEMO) { return; }          // the sample race draws itself
    if (doc.epoch === lastEpoch && doc.seq <= lastSeq) { return; }
    lastEpoch = doc.epoch; lastSeq = doc.seq;
    draw(doc);
  }
  function offline() {
    if (DEMO) { return; }
    lastDoc = null;
    waitingEl.classList.remove('hidden');
    viewEl.classList.add('hidden');
  }

  var pollTimer = null, failures = 0;
  function poll() {
    fetch(SRC + '/live.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (doc) { failures = 0; show(doc); })
      .catch(function () { failures += 1; if (failures > 2) { offline(); } });
  }
  function startPolling() {
    if (pollTimer) { return; }
    poll();
    pollTimer = setInterval(poll, 1000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function connect() {
    if (POLL_ONLY || typeof EventSource === 'undefined') { startPolling(); return; }
    var es = new EventSource(SRC + '/stream');
    var opened = false, errors = 0;
    // No stream in 5 s (a browser source out of connections, a proxy): poll,
    // and try the stream again later.
    var giveUp = setTimeout(function () { if (!opened) { es.close(); startPolling(); setTimeout(retry, 15000); } }, 5000);
    function retry() { stopPolling(); connect(); }
    es.addEventListener('open', function () { opened = true; errors = 0; stopPolling(); });
    es.addEventListener('style', function (ev) {
      opened = true;
      try { styleFromFeed(JSON.parse(ev.data)); } catch (e) { /* a torn frame: the next one is whole */ }
    });
    es.addEventListener('state', function (ev) {
      opened = true;
      try { show(JSON.parse(ev.data)); } catch (e) { /* a torn frame: the next one is whole */ }
    });
    es.addEventListener('error', function () {
      errors += 1;
      if (errors >= 3) {
        clearTimeout(giveUp);
        es.close();
        offline();
        startPolling();
        setTimeout(retry, 15000);
      }
    });
  }

  // ------------------------------------------------------- the sample race
  // ?demo=1: eight cars in two classes and four teams lapping a made-up
  // track, four times real speed, so a style can be seen with no session.
  // The league's own teams and the style's classes are used when there are.
  function demo() {
    var teams = [
      { short: 'PHX', name: 'Phoenix Racing', color: '#ff7a1a', logo: '' },
      { short: 'BLU', name: 'Blue Comet', color: '#3b82f6', logo: '' },
      { short: 'VRD', name: 'Verde Motorsport', color: '#22c55e', logo: '' },
      { short: 'VLT', name: 'Volt Works', color: '#c084fc', logo: '' }
    ];
    var classes = ['GT3', 'GT4'];
    var people = [
      ['Alex Carter', '7'], ['Mia Lindqvist', '12'], ['Jonas Weber', '3'], ['Sofia Reyes', '21'],
      ['Kenji Mori', '44'], ['Liam Doyle', '8'], ['Ana Costa', '16'], ['Theo Laurent', '99']
    ];
    var LAPS = 12, SPEED = 4;
    var cars, events, evSeq = 0, seq = 0, clock, fastest, leaderId, yellowUntil;
    function fmt(t) {
      var ms = Math.round(t * 1000), m = Math.floor(ms / 60000), r = ms - m * 60000;
      var s = Math.floor(r / 1000), f = r - s * 1000;
      return m + ':' + (s < 10 ? '0' : '') + s + '.' + ('00' + f).slice(-3);
    }
    function reset() {
      cars = people.map(function (p, i) {
        var cls = i < 4 ? 0 : 1;
        return { id: i + 1, name: p[0], number: p[1], team: i % 4, cls: cls, grid: i + 1,
          pace: 101.8 + cls * 3.2 + i * 0.12, dist: -i * 0.011, lapStart: 0, last: null, best: null,
          quali: 100.9 + cls * 3.1 + i * 0.137, pits: 0, joker: 0 };
      });
      events = []; clock = 0; fastest = null; leaderId = 1; yellowUntil = -1;
    }
    function add(type, car, txt) {
      evSeq += 1;
      events.push({ seq: evSeq, type: type, ts: Date.now() / 1000, clock: clock, id: car ? car.id : null,
        name: car ? car.name : null, text: txt });
      if (events.length > 20) { events.shift(); }
    }
    function step() {
      clock += SPEED;
      cars.forEach(function (c) {
        var lapBefore = Math.floor(c.dist);
        c.dist += SPEED / (c.pace * (0.985 + Math.random() * 0.03));
        var lap = Math.floor(c.dist);
        if (lap > lapBefore && lap >= 1) {
          var t = c.pace - 0.5 + Math.random() * 1.4;
          if (c.pitNow) { t += 21; c.pitNow = false; }
          c.last = t;
          if (!c.best || t < c.best) { c.best = t; }
          add('lap', c, c.name + ': lap ' + lap + ' ' + fmt(t));
          if (!fastest || t < fastest.time) {
            fastest = { id: c.id, name: c.name, time: t, text: fmt(t) };
            if (lap > 1) { add('fastest', c, 'Fastest lap: ' + c.name + ' ' + fmt(t)); }
          }
          if (c.id === 2 && lap === 3) { c.joker = 1; add('joker', c, c.name + ' takes the joker on lap 3'); }
          if (c.id === 6 && lap === 4) { c.joker = 1; add('joker', c, c.name + ' takes the joker on lap 4'); }
          if ((c.id === 3 && lap === 5) || (c.id === 7 && lap === 6)) {
            c.pits += 1; c.pitNow = true; c.dist -= 0.2;
            add('pit', c, c.name + ' pits (stop ' + c.pits + ')');
          }
          if (c.id === 1 && lap === 7) {
            yellowUntil = clock + 32;
            add('flag', null, 'Yellow flag');
          }
        }
      });
      var order = cars.slice().sort(function (a, b) { return b.dist - a.dist; });
      if (order[0].id !== leaderId && order[0].dist > 1) {
        leaderId = order[0].id;
        add('leader', order[0], order[0].name + ' leads');
      }
      if (order[0].dist >= LAPS) { reset(); }
    }
    function build() {
      seq += 1;
      var order = cars.slice().sort(function (a, b) { return b.dist - a.dist; });
      var lead = order[0], classPos = {}, prev = null;
      var drivers = order.map(function (c, i) {
        classPos[c.cls] = (classPos[c.cls] || 0) + 1;
        var team = teams[c.team % teams.length];
        var behind = lead.dist - c.dist, down = Math.floor(behind);
        var iv = prev ? prev.dist - c.dist : 0;
        prev = c;
        var lap = Math.max(1, Math.min(LAPS, Math.floor(c.dist) + 1));
        var gained = c.grid - (i + 1);
        return {
          id: c.id, name: c.name, position: i + 1, posText: 'P' + (i + 1),
          class: classes[c.cls], classPos: classPos[c.cls], status: 'racing', statusText: 'Racing',
          out: false, gridPos: c.grid, gained: gained, gainedText: gained > 0 ? '+' + gained : (gained < 0 ? String(gained) : ''),
          lap: lap, lapText: lap + '/' + LAPS, lastLapText: c.last ? fmt(c.last) : '', bestLapText: c.best ? fmt(c.best) : '',
          fastest: !!(fastest && fastest.id === c.id),
          gapText: i === 0 ? '' : (down >= 1 ? '+' + down + ' LAP' + (down > 1 ? 'S' : '') : '+' + (behind * c.pace).toFixed(3)),
          intervalText: i === 0 ? '' : '+' + (iv * c.pace).toFixed(3),
          jokerTaken: c.joker, pitStops: c.pits, pitStopsCounted: c.pits,
          pitStopsText: c.pits > 0 ? String(c.pits) : '', penalty: 0, finishText: '',
          number: c.number, team: c.team + 1, teamName: team.name, teamShort: team.short,
          teamColor: team.color, teamLogo: team.logo
        };
      });
      var grid = cars.slice().sort(function (a, b) { return a.grid - b.grid; }).map(function (c) {
        var team = teams[c.team % teams.length];
        return { slot: c.grid, id: c.id, name: c.name, class: classes[c.cls], qualiBestText: fmt(c.quali),
          number: c.number, team: c.team + 1, teamName: team.name, teamShort: team.short,
          teamColor: team.color, teamLogo: team.logo };
      });
      var yellow = clock < yellowUntil;
      var lap = drivers[0].lap;
      return {
        feed: 1, epoch: 'demo', seq: seq, connected: true,
        session: {
          phase: 'racing', phaseText: 'Racing', kind: 'race', layout: 'Demo Circuit',
          lap: lap, lapTarget: LAPS, lapText: lap + '/' + LAPS, lapsToGo: LAPS - lap,
          clockText: Math.floor(clock / 60) + ':' + ('0' + Math.floor(clock % 60)).slice(-2),
          timeLeftText: '', flag: yellow ? 'yellow' : 'green', flagText: yellow ? 'YELLOW FLAG' : '',
          countdown: null, jokerEnabled: true, pitStopsRequired: 0, gridSource: 'quali',
          entrants: drivers.length, heat: null,
          fastestLap: fastest ? { id: fastest.id, name: fastest.name, time: fastest.time, text: fastest.text } : null
        },
        // The camera rides with whoever is third: the banner's `onboard`.
        drivers: drivers, grid: grid, events: events.slice(), camera: drivers[2] || null
      };
    }
    reset();
    // Warm up: a few laps in, so every view has something to show.
    for (var i = 0; i < 80; i += 1) { step(); }
    draw(build());
    setInterval(function () { step(); draw(build()); }, 1000);
    // The league's own teams, and the classes the style colors.
    fetch(SRC + '/teams.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (list) {
        if (!Array.isArray(list)) { return; }
        var real = list.filter(function (t) { return isObj(t) && teamShortOk(t.short) && color(t.color, null); })
          .slice(0, 4).map(function (t) {
            return { short: t.short, name: String(t.name || t.short), color: t.color.toLowerCase(),
              logo: typeof t.logo === 'string' ? t.logo : '' };
          });
        if (real.length) { teams = real; }
      })
      .catch(function () { /* the sample teams stay */ });
    classesFromStyle = function () {
      var named = Object.keys(ST.classColors);
      if (named.length) { classes = [named[0], named[1] || 'GT4']; }
    };
  }
  function teamShortOk(s) { return typeof s === 'string' && /^[A-Z0-9]{2,4}$/.test(s); }
  var classesFromStyle = function () {};

  // ------------------------------------------------------------- start
  fetchStyle();
  if (DEMO) { demo(); }
  // A sample race previewed on the style page needs nothing more from the
  // feed; anything else keeps listening (a demo for the style events only).
  if (!(DEMO && PREVIEW)) { connect(); }
})();
</script>
</body>
</html>
